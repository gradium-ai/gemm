[package]
name = "xn-gemm-f16"
version = "0.20.1"
edition = "2021"
authors = ["sarah <>"]
description = "Fork of the gemm matrix multiplication crates, with a parallel gemv and kc/L1 cache blocking, published for the xn inference framework."
readme = "../README.md"
repository = "https://github.com/gradium-ai/gemm/"
license = "MIT"
keywords = ["linear-algebra"]

[dependencies]
raw-cpuid = { workspace = true }
seq-macro = { workspace = true }
dyn-stack = { workspace = true, default-features = false }
num-traits = { workspace = true, default-features = false }
num-complex = { workspace = true, default-features = false }
paste = { workspace = true }
rayon = { workspace =true, optional = true }

gemm-common = { package = "xn-gemm-common", version = "0.20.1", default-features = false, path = "../gemm-common", features = ["f16"] }
gemm-f32 = { package = "xn-gemm-f32", version = "0.20.1", default-features = false, path = "../gemm-f32" }
half = { workspace = true, default-features = false }

[features]
default = ["std", "rayon"]
std = ["dyn-stack/std", "gemm-common/std", "gemm-f32/std"]
experimental-apple-amx = ["std", "gemm-common/experimental-apple-amx", "gemm-f32/experimental-apple-amx"]
x86-v4 = ["gemm-common/x86-v4", "gemm-f32/x86-v4"]
rayon = ["dep:rayon", "std", "gemm-common/rayon", "gemm-f32/rayon"]
